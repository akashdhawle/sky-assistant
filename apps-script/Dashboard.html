<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Expenses">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #16181d; --muted: #6b7280;
    --line: #e5e7eb; --accent: #4f46e5; --good: #059669; --bad: #dc2626; --warn: #d97706;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1115; --card: #181b22; --text: #eef0f4; --muted: #9aa1ad;
            --line: #2a2f3a; --accent: #818cf8; --good: #34d399; --bad: #f87171; --warn: #fbbf24; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         padding: env(safe-area-inset-top) 16px 96px; max-width: 760px; margin: 0 auto; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 16px 0 8px; }
  header h1 { font-size: 20px; margin: 0; }
  .month { display: flex; align-items: center; gap: 8px; }
  button { font: inherit; cursor: pointer; }
  .month button { border: 1px solid var(--line); background: var(--card); color: var(--text);
                  width: 34px; height: 34px; border-radius: 10px; font-size: 16px; }
  .month span { min-width: 92px; text-align: center; font-weight: 600; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px;
          padding: 16px; margin-top: 12px; }
  .card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em;
             color: var(--muted); margin: 0 0 10px; font-weight: 600;
             display: flex; justify-content: space-between; align-items: center; }
  .link { background: none; border: 0; color: var(--accent); font-size: 13px; font-weight: 600;
          text-transform: none; letter-spacing: 0; padding: 0; }
  .total { font-size: 34px; font-weight: 700; letter-spacing: -.01em; }
  .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .up { color: var(--bad); } .down { color: var(--good); }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
  .stats div { background: var(--bg); border-radius: 10px; padding: 8px; }
  .stats b { display: block; font-size: 15px; }
  .stats small { color: var(--muted); font-size: 12px; }
  .pos { color: var(--good); } .neg { color: var(--bad); }
  .chart { position: relative; height: 220px; }
  .budget { margin: 10px 0 14px; }
  .budget .row1 { display: flex; justify-content: space-between; font-size: 14px; }
  .budget .row1 span:last-child { color: var(--muted); }
  .bar { height: 8px; border-radius: 4px; background: var(--bg); margin-top: 6px; overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 4px; background: var(--accent); }
  .bar i.warn { background: var(--warn); } .bar i.over { background: var(--bad); }
  .edit-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; }
  input, select, textarea { font: inherit; color: var(--text); background: var(--bg);
           border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
  .edit-row input { width: 120px; text-align: right; }
  .emi-edit { display: grid; grid-template-columns: 1fr 96px 56px 28px; gap: 6px; align-items: center; padding: 4px 0; }
  .emi-edit input { width: 100%; min-width: 0; }
  .emi-edit .x { background: none; border: 0; color: var(--muted); font-size: 18px; padding: 0; }
  .tag { font-size: 12px; font-weight: 600; white-space: nowrap; }
  .rows { list-style: none; margin: 0; padding: 0; }
  .rows li { display: flex; justify-content: space-between; align-items: center; gap: 8px;
             padding: 10px 0; border-top: 1px solid var(--line); }
  .rows li:first-child { border-top: 0; }
  .rows .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rows .meta { color: var(--muted); font-size: 12px; }
  .rows .left { min-width: 0; flex: 1; }
  .rows .amt { font-weight: 600; white-space: nowrap; }
  .rows select { font-size: 12px; padding: 2px 4px; margin-top: 4px; }
  .empty { color: var(--muted); text-align: center; padding: 24px 0; }
  .primary { background: var(--accent); color: #fff; border: 0; border-radius: 10px; padding: 10px 16px; font-weight: 600; }
  .ghost { background: none; border: 1px solid var(--line); color: var(--text); border-radius: 10px; padding: 10px 16px; }
  #msg { color: var(--muted); text-align: center; padding: 40px 0; }
  #fab { position: fixed; right: 20px; bottom: calc(20px + env(safe-area-inset-bottom));
         width: 56px; height: 56px; border-radius: 28px; border: 0; background: var(--accent);
         color: #fff; font-size: 30px; line-height: 56px; box-shadow: 0 4px 14px rgba(0,0,0,.25); }
  #sheet { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: flex; align-items: flex-end; justify-content: center; }
  #sheet[hidden] { display: none; }
  .panel { background: var(--card); width: 100%; max-width: 560px; border-radius: 18px 18px 0 0;
           padding: 16px 16px calc(20px + env(safe-area-inset-bottom)); }
  .tabs { display: flex; gap: 6px; background: var(--bg); padding: 4px; border-radius: 10px; margin-bottom: 12px; }
  .tabs button { flex: 1; border: 0; background: none; color: var(--muted); padding: 8px; border-radius: 8px; font-weight: 600; }
  .tabs button.on { background: var(--card); color: var(--text); }
  .field { display: block; margin-bottom: 10px; font-size: 13px; color: var(--muted); }
  .field input, .field select, .field textarea { display: block; width: 100%; margin-top: 4px; font-size: 16px; }
  textarea { min-height: 110px; resize: vertical; }
  .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 6px; }
  .note { font-size: 13px; margin-top: 8px; min-height: 18px; }
  .chat { display: flex; flex-direction: column; gap: 8px; max-height: 320px; overflow-y: auto; margin-bottom: 10px; }
  .chat[hidden] { display: none; }
  .bubble { padding: 8px 12px; border-radius: 14px; max-width: 85%; white-space: pre-wrap; }
  .bubble.me { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
  .bubble.sky { align-self: flex-start; background: var(--bg); border-bottom-left-radius: 4px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .chips[hidden] { display: none; }
  .chips button { border: 1px solid var(--line); background: var(--bg); color: var(--text); border-radius: 999px; padding: 6px 12px; font-size: 13px; }
  .ask { display: flex; gap: 8px; }
  .ask input { flex: 1; min-width: 0; font-size: 16px; padding: 10px 12px; border-radius: 10px; }
  .views { display: flex; gap: 6px; background: var(--card); border: 1px solid var(--line); padding: 4px; border-radius: 12px; margin-top: 4px; }
  .views[hidden] { display: none; }
  .views button { flex: 1; border: 0; background: none; color: var(--muted); padding: 8px; border-radius: 9px; font-weight: 600; }
  .views button.on { background: var(--accent); color: #fff; }
  #lists .tabs { margin: 12px 0 0; gap: 2px; }
  #lists .tabs button { flex: 1 1 0; min-width: 0; padding: 8px 2px; font-size: 13px; }
  #listNote:empty { display: none; }
  .stack { display: grid; gap: 8px; }
  .stack input, .stack textarea { width: 100%; font-size: 16px; padding: 10px 12px; border-radius: 10px; }
  .stack textarea { min-height: 80px; }
  .row2 { display: flex; gap: 8px; }
  .row2 input { flex: 1; min-width: 0; }
  .stars { display: inline-flex; margin-top: 2px; }
  .stars button { background: none; border: 0; padding: 0 2px; font-size: 16px; line-height: 1; color: var(--line); }
  .stars button.on { color: var(--warn); }
  .rows .right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
  .quote { font-size: 18px; line-height: 1.5; font-style: italic; }
  .quote + .sub { margin-top: 8px; }
  .entry { white-space: pre-wrap; }
</style>
</head>
<body>
<header>
  <h1>Expenses</h1>
  <div class="month">
    <button id="prev" aria-label="Previous month">‹</button>
    <span id="monthLabel"></span>
    <button id="next" aria-label="Next month">›</button>
  </div>
</header>
<nav class="views" id="views" hidden>
  <button data-v="money" class="on">Money</button>
  <button data-v="lists">Lists</button>
</nav>

<div id="msg">Loading…</div>

<div id="app" hidden>
  <div class="card">
    <h2>Ask Sky</h2>
    <div class="chat" id="chat" hidden></div>
    <div class="chips" id="askChips">
      <button data-q="How much did I spend this week?">This week's spending</button>
      <button data-q="What did I spend on food this month?">Food this month</button>
      <button data-q="Review my categories for this month">Review my categories</button>
    </div>
    <form class="ask" id="askForm">
      <input id="askText" type="text" autocomplete="off" enterkeyhint="send" aria-label="Ask Sky"
             placeholder="Ask, or tell Sky what to fix">
      <button class="primary" type="submit">Ask</button>
    </form>
  </div>

  <div class="card">
    <h2>Spent this month</h2>
    <div class="total" id="total"></div>
    <div class="sub" id="compare"></div>
    <div class="stats">
      <div><small>Received</small><b id="received"></b></div>
      <div><small>Saved</small><b id="saved"></b></div>
      <div><small>Per day</small><b id="perDay"></b></div>
    </div>
    <div class="sub" id="banks" style="margin-top:10px"></div>
  </div>

  <div class="card">
    <h2>EMIs <button class="link" id="editEmis">Edit</button></h2>
    <div id="emis"></div>
  </div>

  <div class="card">
    <h2>Budgets <button class="link" id="editBudgets">Edit</button></h2>
    <div id="budgets"></div>
  </div>

  <div class="card"><h2>By category</h2><div class="chart"><canvas id="catChart"></canvas></div></div>
  <div class="card"><h2>Day by day</h2><div class="chart"><canvas id="dayChart"></canvas></div></div>
  <div class="card"><h2>Last 6 months</h2><div class="chart"><canvas id="trendChart"></canvas></div></div>
  <div class="card"><h2>Top places</h2><ul class="rows" id="top"></ul></div>
  <div class="card"><h2>Transactions</h2><ul class="rows" id="list"></ul></div>
</div>

<div id="lists" hidden>
  <div class="tabs" id="listTabs">
    <button data-l="books" class="on">Books</button>
    <button data-l="movies">Movies</button>
    <button data-l="places">Places</button>
    <button data-l="quotes">Quotes</button>
    <button data-l="journal">Journal</button>
  </div>
  <div class="card">
    <form class="stack" id="listForm"></form>
    <div class="note" id="listNote"></div>
  </div>
  <div id="listBody"><div class="empty">Loading…</div></div>
</div>

<button id="fab" aria-label="Add a transaction" hidden>+</button>

<div id="sheet" hidden>
  <div class="panel">
    <div class="tabs">
      <button data-tab="sms" class="on">Paste bank SMS</button>
      <button data-tab="manual">Add manually</button>
    </div>
    <div id="tab-sms">
      <label class="field">Copy a missed bank message from Messages and paste it here
        <textarea id="smsText" placeholder="Dear UPI user A/C X1234 debited by…"></textarea>
      </label>
    </div>
    <div id="tab-manual" hidden>
      <div class="tabs" id="typeTabs">
        <button data-type="Debit" class="on">Spent</button>
        <button data-type="Credit">Received</button>
      </div>
      <label class="field">Amount (₹)<input id="mAmount" type="number" inputmode="decimal" min="0" step="0.01"></label>
      <label class="field">What / where<input id="mMerchant" type="text" placeholder="e.g. Vegetables, Auto"></label>
      <label class="field">Category<select id="mCategory"></select></label>
      <label class="field">Date<input id="mDate" type="date"></label>
    </div>
    <div class="note" id="addNote"></div>
    <div class="actions">
      <button class="ghost" id="cancelAdd">Close</button>
      <button class="primary" id="saveAdd">Save</button>
    </div>
  </div>
</div>

<script>
const COLORS = ['#4f46e5','#0891b2','#059669','#d97706','#dc2626','#db2777',
                '#7c3aed','#65a30d','#0284c7','#9ca3af','#78716c'];
const inr = n => (n < 0 ? '-₹' : '₹') + Math.round(Math.abs(n)).toLocaleString('en-IN');
const monthName = d => d.toLocaleString('en-IN', { month: 'short', year: 'numeric' });
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const $ = id => document.getElementById(id);

let all = [], categories = [], incomeCategories = [], budgets = {}, emis = [], charts = {};
let cursor = new Date(); cursor = new Date(cursor.getFullYear(), cursor.getMonth(), 1);
let editing = false, editingEmis = false, addTab = 'sms', addType = 'Debit';

/* BEGIN api */
// Calls a server function in Code.gs. The installable app swaps this block for a fetch-based one.
const api = (fn, ...args) => new Promise((resolve, reject) =>
  google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn](...args));
/* END api */

function load() {
  return api('getData')
    .then(d => {
      all = d.tx.map(t => Object.assign(t, { d: new Date(t.date) }));
      categories = d.categories; incomeCategories = d.incomeCategories; budgets = d.budgets || {}; emis = d.emis || [];
      $('msg').hidden = true;
      if ($('views').hidden) { $('views').hidden = false; setView(view); }
      render();
    })
    .catch(e => { $('msg').hidden = false; $('msg').textContent = 'Could not load: ' + e.message; });
}

const inMonth = (t, y, m) => t.d.getFullYear() === y && t.d.getMonth() === m;
const sum = list => list.reduce((a, t) => a + t.amount, 0);
const isRefund = t => t.type === 'Credit' && t.category === 'Refund';
const isEmi = t => t.type !== 'Credit' && t.category === 'EMI';
// Day-to-day spending. EMIs are shown on their own so a big one doesn't swamp the month.
const debits = list => list.filter(t => t.type !== 'Credit' && t.category !== 'EMI');
const income = list => list.filter(t => t.type === 'Credit' && t.category !== 'Refund');
const netSpent = list => sum(debits(list)) - sum(list.filter(isRefund));

function render() {
  const y = cursor.getFullYear(), m = cursor.getMonth();
  $('monthLabel').textContent = monthName(cursor);
  const month = all.filter(t => inMonth(t, y, m));
  const prev = all.filter(t => inMonth(t, m === 0 ? y - 1 : y, (m + 11) % 12));
  const spent = netSpent(month), prevSpent = netSpent(prev), received = sum(income(month));

  $('total').textContent = inr(spent);
  if (prevSpent > 0) {
    const pct = Math.round((spent - prevSpent) / prevSpent * 100);
    $('compare').innerHTML = `<span class="${pct > 0 ? 'up' : 'down'}">${pct > 0 ? '▲' : '▼'} ${Math.abs(pct)}%</span> vs last month (${inr(prevSpent)})`;
  } else $('compare').textContent = debits(month).length + ' payments';
  $('received').textContent = inr(received);
  const emiPaid = sum(month.filter(isEmi));
  const saved = received - spent - emiPaid;
  $('saved').innerHTML = `<span class="${saved >= 0 ? 'pos' : 'neg'}">${inr(saved)}</span>`;
  const now = new Date();
  const days = (y === now.getFullYear() && m === now.getMonth()) ? now.getDate() : new Date(y, m + 1, 0).getDate();
  $('perDay').textContent = inr(spent / days);
  const bankSpend = b => sum(debits(month).filter(t => t.bank === b)) - sum(month.filter(t => isRefund(t) && t.bank === b));
  const banks = [...new Set(month.map(t => t.bank).filter(Boolean))]
    .map(b => [b, bankSpend(b)]).filter(x => x[1] > 0).sort((x, y) => y[1] - x[1]);
  $('banks').textContent = banks.map(([b, v]) => `${b} ${inr(v)}`).join(' · ');

  // spending per category, with refunds netted out
  const byCat = {};
  debits(month).forEach(t => byCat[t.category] = (byCat[t.category] || 0) + t.amount);
  month.filter(isRefund).forEach(t => {
    const match = debits(month).find(d => d.merchant === t.merchant);
    const c = match ? match.category : 'Shopping';
    byCat[c] = (byCat[c] || 0) - t.amount;
  });

  renderBudgets(byCat);
  renderEmis(month, y, m);

  const cats = Object.keys(byCat).filter(c => byCat[c] > 0).sort((a, b) => byCat[b] - byCat[a]);
  draw('catChart', {
    type: 'doughnut',
    data: { labels: cats.map(c => `${c} ${inr(byCat[c])}`),
            datasets: [{ data: cats.map(c => byCat[c]),
                         backgroundColor: cats.map(c => COLORS[Math.max(0, categories.indexOf(c)) % COLORS.length]),
                         borderColor: css('--card'), borderWidth: 2 }] },
    options: { cutout: '62%', plugins: { legend: { position: 'right', labels: { color: css('--text'), boxWidth: 10, font: { size: 12 } } },
               tooltip: { callbacks: { label: c => ' ' + c.label } } } }
  });

  const nDays = new Date(y, m + 1, 0).getDate();
  const perDay = Array(nDays).fill(0);
  debits(month).forEach(t => perDay[t.d.getDate() - 1] += t.amount);
  draw('dayChart', {
    type: 'bar',
    data: { labels: perDay.map((_, i) => i + 1),
            datasets: [{ data: perDay, backgroundColor: css('--accent'), borderRadius: 3 }] },
    options: axes({ x: { ticks: { maxTicksLimit: 8 } } })
  });

  const labels = [], spentVals = [], emiVals = [], recVals = [];
  for (let i = 5; i >= 0; i--) {
    const d = new Date(y, m - i, 1);
    const list = all.filter(t => inMonth(t, d.getFullYear(), d.getMonth()));
    labels.push(d.toLocaleString('en-IN', { month: 'short' }));
    spentVals.push(netSpent(list)); emiVals.push(sum(list.filter(isEmi))); recVals.push(sum(income(list)));
  }
  draw('trendChart', {
    type: 'bar',
    data: { labels, datasets: [
      { label: 'Spent', data: spentVals, backgroundColor: css('--accent'), borderRadius: 6, stack: 'out' },
      ...(emiVals.some(v => v > 0) ? [{ label: 'EMI', data: emiVals, backgroundColor: css('--warn'), borderRadius: 6, stack: 'out' }] : []),
      { label: 'Received', data: recVals, backgroundColor: css('--good'), borderRadius: 6, stack: 'in' } ] },
    options: axes({ legend: true, stacked: true })
  });

  const byM = {};
  debits(month).forEach(t => byM[t.merchant] = (byM[t.merchant] || 0) + t.amount);
  const top = Object.keys(byM).sort((a, b) => byM[b] - byM[a]).slice(0, 5);
  $('top').innerHTML = top.length ? top.map(k =>
    `<li><div class="left"><div class="name">${esc(k)}</div></div><div class="amt">${inr(byM[k])}</div></li>`).join('')
    : '<li class="empty">Nothing yet this month</li>';

  const list = month.slice().sort((a, b) => b.d - a.d);
  $('list').innerHTML = list.length ? list.map(t => {
    const credit = t.type === 'Credit';
    const opts = credit ? incomeCategories : categories;
    return `<li><div class="left">
      <div class="name">${esc(t.merchant)}</div>
      <div class="meta">${t.d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short' })} · ${esc(t.bank)} ${t.account ? '··' + esc(t.account) : ''} · ${esc(t.mode)}</div>
      <select data-row="${t.row}">${opts.map(c => `<option${c === t.category ? ' selected' : ''}>${c}</option>`).join('')}</select>
    </div><div class="amt ${credit ? 'pos' : ''}">${credit ? '+' : ''}${inr(t.amount)}</div></li>`;
  }).join('') : '<li class="empty">No transactions this month</li>';
}

function renderBudgets(byCat) {
  $('editBudgets').textContent = editing ? 'Save' : 'Edit';
  if (editing) {
    $('budgets').innerHTML = categories.filter(c => c !== 'EMI').map(c => `
      <div class="edit-row"><span>${c}</span>
        <input type="number" inputmode="numeric" min="0" step="100" data-cat="${c}" value="${budgets[c] || ''}" placeholder="No limit"></div>`).join('') +
      '<div class="sub">Leave blank for no limit. You get a phone alert at 80% and 100%.</div>';
    return;
  }
  const set = categories.filter(c => budgets[c] > 0);
  if (!set.length) {
    $('budgets').innerHTML = '<div class="empty">No budgets yet. Tap Edit to set a monthly limit per category.</div>';
    return;
  }
  $('budgets').innerHTML = set.map(c => {
    const spent = Math.max(0, byCat[c] || 0), limit = budgets[c];
    const pct = spent / limit * 100;
    const cls = pct >= 100 ? 'over' : pct >= 80 ? 'warn' : '';
    const left = limit - spent;
    return `<div class="budget"><div class="row1"><span>${c}</span>
      <span>${inr(spent)} of ${inr(limit)} · ${left >= 0 ? inr(left) + ' left' : '<span class="neg">' + inr(-left) + ' over</span>'}</span></div>
      <div class="bar"><i class="${cls}" style="width:${Math.min(100, pct)}%"></i></div></div>`;
  }).join('');
}

$('editBudgets').onclick = () => {
  if (!editing) { editing = true; render(); return; }
  const next = {};
  document.querySelectorAll('#budgets input').forEach(i => { if (Number(i.value) > 0) next[i.dataset.cat] = Number(i.value); });
  budgets = next; editing = false; render();
  api('setBudgets', next).catch(err => alert('Could not save budgets: ' + err.message));
};

// Pairs each expected EMI with an EMI payment that month. Keep in step with matchEmis_ in Code.gs.
function matchEmis(list, monthDebits) {
  const used = [];
  return list.map(e => {
    const kw = (e.match || '').toLowerCase();
    const hit = monthDebits.find(t => !used.includes(t) && t.category === 'EMI' &&
      (kw ? t.merchant.toLowerCase().includes(kw) : Math.abs(t.amount - e.amount) <= Math.max(1, e.amount * 0.02)));
    if (hit) used.push(hit);
    return Object.assign({}, e, { paid: hit || null });
  });
}

const ord = n => n + ((n % 100 >= 11 && n % 100 <= 13) ? 'th' : ({ 1: 'st', 2: 'nd', 3: 'rd' }[n % 10] || 'th'));

function renderEmis(month, y, m) {
  $('editEmis').textContent = editingEmis ? 'Save' : 'Edit';
  if (editingEmis) {
    const row = e => `<div class="emi-edit" data-match="${esc(e.match || '')}">
      <input type="text" placeholder="e.g. Car loan" value="${esc(e.name || '')}">
      <input type="number" inputmode="numeric" min="0" placeholder="₹ amount" value="${e.amount || ''}">
      <input type="number" inputmode="numeric" min="1" max="31" placeholder="Day" value="${e.day || ''}">
      <button class="x" aria-label="Remove">×</button></div>`;
    $('emis').innerHTML = `<div id="emiRows">${(emis.length ? emis : [{}]).map(row).join('')}</div>
      <button class="link" id="addEmi" style="margin-top:8px">+ Add EMI</button>
      <div class="sub">Name, monthly amount and the day of the month it's deducted. You get a reminder the evening before.</div>`;
    $('addEmi').onclick = () => $('emiRows').insertAdjacentHTML('beforeend', row({}));
    $('emiRows').onclick = e => { if (e.target.classList.contains('x')) e.target.parentNode.remove(); };
    return;
  }
  const paidList = month.filter(isEmi);
  const status = matchEmis(emis, paidList);
  const now = new Date(), thisMonth = y === now.getFullYear() && m === now.getMonth();
  const future = new Date(y, m, 1) > now;
  const lastDay = new Date(y, m + 1, 0).getDate();
  const rows = status.map(e => {
    const day = Math.min(e.day, lastDay);
    const tag = e.paid ? `<span class="tag pos">Paid ${e.paid.d.getDate()} ${e.paid.d.toLocaleString('en-IN', { month: 'short' })}</span>`
      : (thisMonth && day < now.getDate()) || (!thisMonth && !future) ? `<span class="tag neg">Not seen (due ${ord(day)})</span>`
      : `<span class="tag">Due ${ord(day)}</span>`;
    return `<li><div class="left"><div class="name">${esc(e.name)}</div><div class="meta">${inr(e.amount)} every month</div></div>${tag}</li>`;
  });
  const matched = status.filter(e => e.paid).map(e => e.paid);
  paidList.filter(t => !matched.includes(t)).forEach(t => rows.push(
    `<li><div class="left"><div class="name">${esc(t.merchant)}</div><div class="meta">${t.d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short' })} · not in your EMI list</div></div><div class="amt">${inr(t.amount)}</div></li>`));
  const expected = sum(emis);
  const head = `<div class="total" style="font-size:24px">${inr(sum(paidList))}</div>
    <div class="sub">${expected ? `paid of ${inr(expected)} expected this month` : 'paid this month'}</div>`;
  $('emis').innerHTML = rows.length ? head + `<ul class="rows" style="margin-top:8px">${rows.join('')}</ul>`
    : '<div class="empty">No EMIs yet. Tap Edit to add your loans, with the amount and the day each one is deducted.</div>';
}

$('editEmis').onclick = () => {
  if (!editingEmis) { editingEmis = true; render(); return; }
  const next = [...document.querySelectorAll('#emiRows .emi-edit')].map(r => {
    const [name, amount, day] = [...r.querySelectorAll('input')].map(i => i.value.trim());
    return { name, amount: Number(amount), day: Math.min(31, Math.max(1, Number(day) || 1)), match: r.dataset.match };
  }).filter(e => e.name && e.amount > 0);
  emis = next; editingEmis = false; render();
  api('setEmis', next).then(saved => { emis = saved; render(); })
    .catch(err => alert('Could not save EMIs: ' + err.message));
};

function axes(extra) {
  const grid = { color: css('--line') }, ticks = { color: css('--muted') };
  return { plugins: { legend: { display: !!extra.legend, labels: { color: css('--text'), boxWidth: 10 } },
                      tooltip: { callbacks: { label: c => ' ' + inr(c.raw) } } },
           scales: { x: Object.assign({ grid: { display: false }, ticks, stacked: !!extra.stacked }, extra.x || {}),
                     y: { grid, beginAtZero: true, suggestedMax: 500, stacked: !!extra.stacked,
                          ticks: Object.assign({}, ticks, { precision: 0, callback: v => inr(v) }) } } };
}

function draw(id, cfg) {
  if (charts[id]) charts[id].destroy();
  cfg.options = Object.assign({ responsive: true, maintainAspectRatio: false }, cfg.options);
  charts[id] = new Chart($(id), cfg);
}

function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

$('list').addEventListener('change', e => {
  if (e.target.tagName !== 'SELECT') return;
  const row = Number(e.target.dataset.row), cat = e.target.value;
  all.find(x => x.row === row).category = cat;
  render();
  api('setCategory', row, cat).catch(err => alert('Could not save: ' + err.message));
});
// ----- Ask Sky (Assistant.gs) -----
const chat = [];
function renderChat() {
  $('chat').innerHTML = chat.map(m => `<div class="bubble ${m.who}">${esc(m.text)}</div>`).join('');
  $('chat').hidden = !chat.length;
  $('chat').scrollTop = $('chat').scrollHeight;
}
function askSky(text) {
  text = text.trim();
  if (!text) return;
  const reply = { who: 'sky', text: '…' };
  chat.push({ who: 'me', text }, reply);
  $('askText').value = ''; $('askChips').hidden = true;
  renderChat();
  api('ask', text)
    .then(r => { reply.text = r; renderChat(); load(); if (lists) loadLists(); })  // Sky may have changed a category or a list
    .catch(e => { reply.text = 'Sorry, that didn\'t work: ' + e.message; renderChat(); });
}
$('askForm').onsubmit = e => { e.preventDefault(); askSky($('askText').value); };
$('askChips').onclick = e => { if (e.target.dataset.q) askSky(e.target.dataset.q); };

// ----- Lists: books, movies, places, quotes and journal (Assistant.gs) -----
let lists = null, listTab = 'books', view = 'money';
const LIST_FORMS = {
  books: { title: 'Add a book', detail: 'Author' },
  movies: { title: 'Add a movie or show', detail: 'Year or director' },
  places: { title: 'Add a place to visit', detail: 'City or country' },
};
function setView(v) {
  view = v;
  document.querySelectorAll('#views button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  $('app').hidden = v !== 'money'; $('fab').hidden = v !== 'money'; $('lists').hidden = v !== 'lists';
  document.querySelector('.month').style.visibility = v === 'money' ? '' : 'hidden';
  if (v === 'lists') { renderListForm(); if (lists) renderLists(); else loadLists(); }
}
function loadLists() {
  return api('getLists').then(d => { lists = d; renderLists(); })
    .catch(e => { $('listBody').innerHTML = `<div class="empty">Could not load: ${esc(e.message)}</div>`; });
}
function listCall(fn, ...args) {
  $('listNote').className = 'note'; $('listNote').textContent = 'Saving…';
  return api(fn, ...args).then(d => { lists = d; $('listNote').textContent = ''; renderLists(); return true; })
    .catch(e => { $('listNote').className = 'note neg'; $('listNote').textContent = e.message; return false; });
}
function renderListForm() {
  document.querySelectorAll('#listTabs button').forEach(b => b.classList.toggle('on', b.dataset.l === listTab));
  const f = LIST_FORMS[listTab];
  $('listForm').innerHTML = f
    ? `<input id="lTitle" type="text" autocomplete="off" placeholder="${f.title}" aria-label="${f.title}">
       <div class="row2"><input id="lDetail" type="text" autocomplete="off" placeholder="${f.detail} (optional)" aria-label="${f.detail}">
       <button class="primary" type="submit">Add</button></div>`
    : listTab === 'quotes'
    ? `<textarea id="lQuote" placeholder="A quote you liked" aria-label="Quote"></textarea>
       <div class="row2"><input id="lSource" type="text" placeholder="Book or film" aria-label="Source">
       <input id="lAuthor" type="text" placeholder="Who said it" aria-label="Author"></div>
       <div class="actions"><button class="primary" type="submit">Save quote</button></div>`
    : `<textarea id="lEntry" placeholder="What happened today?" aria-label="Journal entry"></textarea>
       <div class="actions"><button class="primary" type="submit">Save entry</button></div>`;
  $('listNote').textContent = '';
}
const stars = (row, n) => `<span class="stars" data-row="${row}">${[1, 2, 3, 4, 5].map(i =>
  `<button data-star="${i}" class="${i <= n ? 'on' : ''}" aria-label="${i} star${i > 1 ? 's' : ''}">★</button>`).join('')}</span>`;
function renderLists() {
  if (!lists) return;
  const body = $('listBody');
  if (LIST_FORMS[listTab]) {
    const items = lists[listTab], statuses = lists.statuses[listTab];
    body.innerHTML = statuses.map(st => {
      const group = items.filter(it => it.status === st);
      if (!group.length) return '';
      const done = st === statuses[statuses.length - 1];
      return `<div class="card"><h2>${st} · ${group.length}</h2><ul class="rows">${group.map(it => `<li>
        <div class="left"><div class="name">${esc(it.title)}</div>
          <div class="meta">${esc([it.detail, it.note].filter(Boolean).join(' · ') || 'Added ' + it.added)}</div>
          ${done ? stars(it.row, it.rating) : ''}</div>
        <div class="right"><select data-row="${it.row}" aria-label="Status">${statuses.concat(['Removed']).map(x =>
          `<option${x === it.status ? ' selected' : ''}>${x === 'Removed' ? 'Remove' : x}</option>`).join('')}</select></div>
      </li>`).join('')}</ul></div>`;
    }).join('') || `<div class="card"><div class="empty">Nothing here yet. Add one above, or tell Sky "add … to my ${
      { books: 'reading list', movies: 'watchlist', places: 'places to visit' }[listTab]}".</div></div>`;
  } else if (listTab === 'quotes') {
    const q = lists.quotes;
    const pick = q.length ? q[Math.floor(Math.random() * q.length)] : null;
    body.innerHTML = (pick ? `<div class="card"><h2>A quote for you <button class="link" id="nextQuote">Another</button></h2>
        <div class="quote">“${esc(pick.quote)}”</div><div class="sub">${esc([pick.author, pick.source].filter(Boolean).join(', '))}</div></div>` : '') +
      `<div class="card"><h2>Saved · ${q.length}</h2><ul class="rows">${q.map(x => `<li><div class="left">
        <div class="entry">“${esc(x.quote)}”</div><div class="meta">${esc([x.author, x.source].filter(Boolean).join(', '))}</div></div></li>`).join('')
        || '<li class="empty">No quotes yet</li>'}</ul></div>`;
    if (pick) $('nextQuote').onclick = renderLists;
  } else {
    body.innerHTML = `<div class="card"><h2>Recent entries</h2><ul class="rows">${lists.journal.map(e => `<li><div class="left">
      <div class="meta">${new Date(e.date.replace(' ', 'T')).toLocaleString('en-IN', { weekday: 'short', day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' })}</div>
      <div class="entry">${esc(e.entry)}</div></div></li>`).join('') || '<li class="empty">No entries yet</li>'}</ul></div>`;
  }
}
$('views').onclick = e => { if (e.target.dataset.v) setView(e.target.dataset.v); };
$('listTabs').onclick = e => { if (e.target.dataset.l) { listTab = e.target.dataset.l; renderListForm(); renderLists(); } };
$('listForm').onsubmit = e => {
  e.preventDefault();
  const val = id => ($(id) ? $(id).value.trim() : '');
  let done;
  if (LIST_FORMS[listTab]) {
    if (!val('lTitle')) return;
    done = listCall('listAdd', listTab, { title: val('lTitle'), detail: val('lDetail'), note: '' });
  } else if (listTab === 'quotes') {
    if (!val('lQuote')) return;
    done = listCall('quoteAdd', { quote: val('lQuote'), source: val('lSource'), author: val('lAuthor') });
  } else {
    if (!val('lEntry')) return;
    done = listCall('journalAdd', val('lEntry'));
  }
  done.then(ok => { if (ok) renderListForm(); });
};
$('listBody').addEventListener('change', e => {
  if (e.target.tagName !== 'SELECT') return;
  const st = e.target.value === 'Remove' ? 'Removed' : e.target.value;
  listCall('listSet', listTab, Number(e.target.dataset.row), { status: st });
});
$('listBody').addEventListener('click', e => {
  const n = e.target.dataset.star;
  if (!n) return;
  const row = Number(e.target.parentNode.dataset.row);
  const cur = lists[listTab].find(it => it.row === row);
  listCall('listSet', listTab, row, { rating: cur && cur.rating === Number(n) ? 0 : Number(n) });
});

$('prev').onclick = () => { cursor = new Date(cursor.getFullYear(), cursor.getMonth() - 1, 1); render(); };
$('next').onclick = () => { cursor = new Date(cursor.getFullYear(), cursor.getMonth() + 1, 1); render(); };

// ----- add a missed or cash transaction -----
function fillCategories() {
  const list = addType === 'Credit' ? incomeCategories : categories;
  $('mCategory').innerHTML = list.map(c => `<option>${c}</option>`).join('');
  $('mCategory').value = addType === 'Credit' ? 'Received' : 'Other';
}
function setTab(tab) {
  addTab = tab;
  document.querySelectorAll('.panel > .tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  $('tab-sms').hidden = tab !== 'sms'; $('tab-manual').hidden = tab !== 'manual';
  $('addNote').textContent = '';
}
$('fab').onclick = () => {
  $('sheet').hidden = false; $('smsText').value = ''; $('mAmount').value = ''; $('mMerchant').value = '';
  $('mDate').value = new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10);
  fillCategories(); setTab('sms');
};
$('cancelAdd').onclick = () => { $('sheet').hidden = true; };
$('sheet').onclick = e => { if (e.target.id === 'sheet') $('sheet').hidden = true; };
document.querySelectorAll('.panel > .tabs button').forEach(b => b.onclick = () => setTab(b.dataset.tab));
document.querySelectorAll('#typeTabs button').forEach(b => b.onclick = () => {
  addType = b.dataset.type;
  document.querySelectorAll('#typeTabs button').forEach(x => x.classList.toggle('on', x === b));
  fillCategories();
});
$('saveAdd').onclick = () => {
  const note = $('addNote'); note.className = 'note'; note.textContent = 'Saving…';
  const done = r => {
    note.className = 'note ' + (r.saved ? 'pos' : 'neg');
    note.textContent = r.saved ? 'Saved: ' + r.notify : (r.notify || 'Not saved');
    if (r.saved) { load(); setTimeout(() => { $('sheet').hidden = true; }, 900); }
  };
  const fail = e => { note.className = 'note neg'; note.textContent = e.message; };
  if (addTab === 'sms') {
    api('addFromSms', $('smsText').value).then(done, fail);
  } else {
    api('addManual', {
      type: addType, amount: $('mAmount').value, merchant: $('mMerchant').value,
      category: $('mCategory').value, date: $('mDate').value, bank: 'Cash' }).then(done, fail);
  }
};

load();
</script>
